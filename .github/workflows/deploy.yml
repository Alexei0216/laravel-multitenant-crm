name: Deploy to Droplet

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host droplet\n  HostName ${{ secrets.DO_HOST }}\n  User ${{ secrets.DO_USER }}\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking=no\n" >> ~/.ssh/config

      - name: Deploy via SSH
        run: |
          ssh droplet << 'EOF'
            cd /var/www/crm
            git pull origin main
            composer i
            docker compose down
            docker compose -f docker-compose.prod.yml up -d --build
          EOF
